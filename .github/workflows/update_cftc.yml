name: Weekly CFTC Data Update

on:
  schedule:
    # Jeden Freitag um 22:30 Uhr UTC (ca. 23:30 / 00:30 Uhr Frankfurt)
    # Die CFTC veröffentlicht um 15:30 US Eastern Time (~21:30 deutscher Zeit)
    - cron: '30 22 * * 5'
  
  # Ermöglicht es, den Workflow jederzeit manuell in GitHub per Klick zu testen:
  workflow_dispatch:

jobs:
  run-pipeline:
    # Je nach DBG-Setup: 'ubuntu-latest' oder euer interner Runner-Tag (z. B. 'self-hosted')
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python 3.11 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pipeline ausführen
        run: |
          python data_cleaning.py

      - name: Aktualisierte Parquet-Dateien committen & pushen
        run: |
          git config --global user.name "CFTC Automation Bot"
          git config --global user.email "actions@github.deutsche-boerse.com"
          git add *.parquet
          # Nur committen, wenn sich die Parquet-Dateien tatsächlich geändert haben:
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-Update: CFTC Daten per $(date +'%Y-%m-%d')" && git push)
