name: Weekly CFTC Data Update

on:
  schedule:
    # Every Friday at 22:30 UTC (approx. 23:30 / 00:30 Frankfurt time)
    # The CFTC releases data at 15:30 US Eastern Time (~21:30 German time)
    - cron: '30 22 * * 5'
  
  # Allow manual triggering of the workflow in GitHub via the "Run workflow" button:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        run: |
          python data_cleaning.py

      - name: Commit & push updated Parquet files
        run: |
          git config --global user.name "CFTC Automation Bot"
          git config --global user.email "actions@github.deutsche-boerse.com"
          git add *.parquet
          # Nur committen, wenn sich die Parquet-Dateien tatsächlich geändert haben:
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-Update: CFTC Daten per $(date +'%Y-%m-%d')" && git push)
